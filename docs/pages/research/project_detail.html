<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Project Detail</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="ongoing_list.css">
  <link rel="stylesheet" href="../../assets/vendor/docx-preview.min.css">
  <script defer src="../../assets/vendor/jszip.min.js"></script>
  <script defer src="../../assets/vendor/docx-preview.min.js"></script>
  <script defer src="project_detail.js"></script>
</head>

<body class="detail-page">
  <header class="page-top">
    <div class="page-shell">
      <div class="page-bar">
        <div class="page-links">
          <a href="../../index.html" class="pill-link">Home</a>
          <span class="divider">/</span>
          <a href="ongoing_list.html" class="pill-link">Projects</a>
          <span class="divider">/</span>
          <span class="crumb" id="project-crumb">Loading...</span>
        </div>
        <span class="badge" id="project-status">Project</span>
      </div>
    </div>
  </header>

  <main class="detail-shell">
    <section class="detail-top">
      <div>
        <p class="eyebrow">Research project</p>
        <h1 id="project-title">Loading...</h1>
        <p id="project-summary"></p>
        <div class="project-card__meta" id="project-tags"></div>
      </div>
      <div class="detail-gallery" id="project-images"></div>
    </section>

    <section class="docx-container">
      <p id="docx-status" class="docx-status">Loading document...</p>
      <div id="docx-root" class="docx-root"></div>
    </section>
  </main>
</body>
</html>
